[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.17",
    "playwright>=1.64.1",
    "pydantic-settings>=2.16.1",
    "pymongo>=4.19.0",
    "pymupdf>=2.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
